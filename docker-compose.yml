version: "3.9"

services:
  app:
    build: .
    container_name: gocar_app
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-gocar}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    networks:
      - gocar_net

  db:
    image: postgres:16-alpine
    container_name: gocar_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-gocar}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - gocar_net

  web:
    image: nginx:alpine
    container_name: gocar_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - .:/var/www/html:ro
    depends_on:
      - app
    networks:
      - gocar_net

volumes:
  db_data:
    driver: local

networks:
  gocar_net:
    driver: bridge
